[package]
name = "vela-widgets"
version = "0.1.0"
description = "A quiet, local-first desktop widget workspace for Windows"
authors = ["Vela"]
edition = "2021"

[lib]
name = "vela_widgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["System", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"
