<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vela · 竖版高度对齐</title></head>
<body><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue';
import MediaFace from '/src/features/media/components/MediaFace.vue';
import TodoWidget from '/src/features/todos/components/TodoWidget.vue';
import HabitWidget from '/src/features/habits/components/HabitWidget.vue';
import { snapshot } from '/src/app/store.ts';
import { templateLayout, widgetFootprint } from '/src/features/desktop/layout.ts';
import { createMediaPreviewSession } from '/src/features/media/mediaPreview.ts';
import '/src/shared/styles/base.css';
import '/src/shared/styles/widgets.css';
import '/src/features/habits/habits.css';
import '/src/features/media/media.css';

// This fixture changes only in-memory preview state, never persisted app settings.
for (const [kind, widget] of Object.entries(snapshot.value.settings.widgets)) {
  Object.assign(widget, { enabled: ['media','todo','habit'].includes(kind), size: kind === 'media' ? 'medium' : 'small', locked: false, x: null, y: null });
}
snapshot.value.settings.media.theme = 'atmosphere';
document.documentElement.dataset.theme = 'dark';
const placements = templateLayout('right', {width:500,height:404}, snapshot.value.settings);
createApp({ setup() {
  const session = ref(createMediaPreviewSession());
  function action(input) {
    if (input.action === 'play' || input.action === 'pause') session.value = {...session.value,playbackStatus:input.action==='play'?'playing':'paused'};
    if (input.action === 'seek') session.value = {...session.value,positionMs:input.positionMs};
    if (input.action === 'volume') session.value = {...session.value,volume:{...session.value.volume,level:input.volumeLevel}};
    if (input.action === 'mute') session.value = {...session.value,volume:{...session.value.volume,muted:input.muted}};
  }
  return () => h('main', {class:'alignment-page'}, [
    h('p', {class:'eyebrow'}, 'VELA / LAYOUT PREVIEW'),
    h('h1','上下边，刚好对齐。'),
    h('p', {class:'description'}, '竖版播放器 224 × 356 · 两个小组件 170 + 16 + 170'),
    h('section', {class:'alignment-canvas','aria-label':'自动布局对齐预览'}, placements.map(p => {
      const size = widgetFootprint(p.kind,p.size,'atmosphere');
      return h('div',{class:'alignment-widget','data-kind':p.kind,style:{position:'absolute',left:`${p.x}px`,top:`${p.y}px`,width:`${size.width}px`,height:`${size.height}px`}},[
        p.kind==='media' ? h('div',{class:'widget-window media-window media-theme-atmosphere size-medium',style:{width:'100%',height:'100%'}},[h(MediaFace,{session:session.value,theme:'atmosphere',size:'medium',now:0,busy:false,onAction:action})])
          : h(p.kind==='todo'?TodoWidget:HabitWidget)
      ]);
    })),
    h('p',{class:'caption'},'真实组件与自动布局计算。示例封面仅用于展示外观。'),
  ]);
} }).mount('#app');
</script>
<style>
body {overflow:auto;background:#101821;}
.alignment-page {width:580px;margin:32px auto;padding:26px 40px;color:#e9eaf0;--widget-radius:19px;--widget-edge-inset:1px;--widget-background-alpha:.88;}
.eyebrow {margin:0 0 14px;color:#a1afb9;font:10px/16px Consolas,monospace;letter-spacing:.18em;}
.alignment-page h1 {font-size:28px;font-weight:500;margin:0 0 12px;}
.description,.caption {font-size:12px;line-height:20px;color:#a1afb9;}
.alignment-canvas {position:relative;width:500px;height:404px;margin:20px 0 18px;border-radius:20px;background:radial-gradient(ellipse at 0% 90%,#39382980,transparent 80%),#16222f;}
.alignment-canvas::before,.alignment-canvas::after {content:'';position:absolute;left:18px;right:18px;border-top:1px dashed #a1afb966;pointer-events:none;}
.alignment-canvas::before {top:24px;}.alignment-canvas::after {top:380px;}
</style>
</body></html>
