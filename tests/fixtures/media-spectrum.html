<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vela · 频谱显示验证</title></head>
<body><div id="app"></div>
<script type="module">
import { createApp,h,ref } from 'vue';
import MediaFace from '/src/features/media/components/MediaFace.vue';
import { createMediaPreviewSession } from '/src/features/media/mediaPreview.ts';
import { mediaWidgetDimensions } from '/src/features/media/mediaThemes.ts';
import '/src/shared/styles/base.css';
import '/src/shared/styles/widgets.css';
import '/src/features/media/media.css';

createApp({setup(){
  const session=ref({...createMediaPreviewSession(),playbackStatus:'playing'});
  const spectrum=ref({revision:1,sessionId:session.value.id,status:'ready',bands:[.9,.2,.1,.05]});
  const label=ref('低频测试'),size=ref('medium');
  function show(name,bands,status='ready',old=false){label.value=name;session.value={...session.value,playbackStatus:'playing'};spectrum.value={revision:spectrum.value.revision+1,sessionId:old?'previous-player':session.value.id,status,bands};}
  return()=>h('main',{class:'spectrum-page'},[
    h('p',{class:'eyebrow'},'VELA / SPECTRUM DISPLAY TEST'),h('h1','真实频谱的显示验证'),
    h('p',{class:'description'},'这里使用明确的测试频段数值，验证界面映射；不是当前播放器的声音。'),
    h('nav',{'aria-label':'频谱测试'},[
      h('button',{onClick:()=>show('低频测试',[.9,.2,.1,.05])},'低频'),
      h('button',{onClick:()=>show('高频测试',[.05,.1,.2,.9])},'高频'),
      h('button',{onClick:()=>show('静音测试',[0,0,0,0])},'静音'),
      h('button',{onClick:()=>show('采集不可用',[.9,.9,.9,.9],'unavailable')},'不可用'),
      h('button',{onClick:()=>show('旧播放器数据',[.9,.9,.9,.9],'ready',true)},'旧数据'),
      h('button',{onClick:()=>{label.value='已暂停';session.value={...session.value,playbackStatus:'paused'};}},'暂停'),
      ...['small','medium','large'].map((s,i)=>h('button',{'aria-pressed':size.value===s,onClick:()=>size.value=s},['小','中','大'][i])),
    ]),
    h('p',{role:'status'},label.value),
    h('div',{class:`widget-window media-window media-theme-minimal size-${size.value}`,style:{width:`${mediaWidgetDimensions(size.value,'minimal').width}px`,height:`${mediaWidgetDimensions(size.value,'minimal').height}px`}},[
      h(MediaFace,{session:session.value,spectrum:spectrum.value,size:size.value,theme:'minimal',now:0,busy:false}),
    ]),
    h('p',{class:'description'},'四根柱对应 60–250 Hz、250–1000 Hz、1–4 kHz、4–16 kHz。真实数据模式不运行示例动画。'),
  ]);
}}).mount('#app');
</script>
<style>
body{overflow:auto;background:#17212a;}.spectrum-page{max-width:720px;margin:50px auto;padding:30px;color:#e8edf2;--widget-background-alpha:.15;--widget-radius:19px;--widget-edge-inset:1px;}
.eyebrow{color:#93a6b8;font:10px/18px Consolas,monospace;letter-spacing:.15em;}.spectrum-page h1{font-size:27px;font-weight:500;}.description{font-size:12px;line-height:22px;color:#a7b5c4;}
.spectrum-page nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0;}.spectrum-page nav button{padding:7px 13px;border:1px solid #536779;border-radius:8px;background:#253342;color:#e8edf2;cursor:pointer;}.spectrum-page nav button[aria-pressed=true]{background:#4b6680;}[role=status]{color:#c997bd;font-size:12px;}
</style>
</body></html>
