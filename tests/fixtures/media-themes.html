<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vela · 播放器主题</title></head>
<body><div id="app"></div>
<script type="module">
import { createApp, computed, h, ref } from 'vue';
import MediaFace from '/src/features/media/components/MediaFace.vue';
import { mediaThemes, mediaWidgetDimensions } from '/src/features/media/mediaThemes.ts';
import { createMediaPreviewSession } from '/src/features/media/mediaPreview.ts';
import '/src/shared/styles/base.css';
import '/src/shared/styles/widgets.css';
import '/src/features/media/media.css';

createApp({ setup() {
  const size = ref('medium'), dark = ref(false), transparent = ref(false);
  const session = ref(createMediaPreviewSession());
  const now = ref(Date.now());
  setInterval(() => { if (!document.hidden) now.value = Date.now(); }, 1000);
  const dimensions = theme => mediaWidgetDimensions(size.value, theme);
  function action(input) {
    if (input.action === 'play' || input.action === 'pause') {
      const elapsed = session.value.playbackStatus === 'playing' ? now.value - session.value.updatedAt : 0;
      session.value = {...session.value, positionMs: Math.min(session.value.durationMs, session.value.positionMs + elapsed), playbackStatus: input.action === 'play' ? 'playing' : 'paused', updatedAt: now.value};
    }
    if (input.action === 'seek') session.value = {...session.value, positionMs: input.positionMs, updatedAt: now.value};
    if (input.action === 'volume') session.value.volume = {level: input.volumeLevel, muted: input.volumeLevel === 0};
    if (input.action === 'mute') session.value.volume = {...session.value.volume, muted: input.muted};
  }
  return () => h('main', {class: 'theme-gallery', style: {'--widget-background-alpha':transparent.value ? .15 : 1}}, [
    h('header', [h('p', {class:'gallery-eyebrow'},'VELA / NOW PLAYING'), h('h1','给音乐，换一种心情。'), h('p',{class:'gallery-subtitle'},'三款播放器主题 · 真实组件预览 · 封面自动取色')]),
    h('nav', {class:'gallery-toolbar', 'aria-label':'预览选项'}, [
      ...['small','medium','large'].map((value,i) => h('button',{type:'button','aria-pressed':size.value === value,onClick:() => size.value=value},['小','中','大'][i])),
      h('button',{type:'button',onClick:() => {dark.value=!dark.value;document.documentElement.dataset.theme=dark.value?'dark':'light';}},'切换深浅外观'),
      h('button',{type:'button',onClick:() => transparent.value=!transparent.value},transparent.value?'恢复不透明背景':'模拟高透明度'),
      h('button',{type:'button',onClick:() => action({action:session.value.playbackStatus==='playing'?'pause':'play'})},session.value.playbackStatus==='playing'?'暂停动画':'播放动画'),
    ]),
    h('section',{class:`gallery-grid gallery-${size.value}`},mediaThemes.filter(theme=>theme.value!=='default').map((theme,i) => h('article', {class:theme.value==='atmosphere'?'gallery-poster':''}, [
      h('div',{class:'gallery-caption'},[h('span',`0${i+1} / ${theme.label}`),h('span',theme.description)]),
      h('div',{class:`widget-window media-window media-theme-${theme.value} size-${size.value}`,style:`width:${dimensions(theme.value).width}px;height:${dimensions(theme.value).height}px`},[
        h(MediaFace,{theme:theme.value,size:size.value,session:{...session.value,controls:{...session.value.controls,previous:false,next:false}},now:now.value,busy:false,onAction:action})
      ])
    ]))),
    h('footer','示例曲目「落日之后」仅用于外观展示。桌面组件读取当前播放器的封面、曲目和播放控制。'),
  ]);
} }).mount('#app');
</script>
<style>
body {overflow:auto;background:#e7e6de;}
.theme-gallery {max-width:680px;margin:auto;padding:44px 40px 32px;color:#26382c;--widget-background-alpha:1;--widget-radius:22px;}
.gallery-eyebrow {margin:0 0 16px;font:10px/16px 'Consolas',monospace;letter-spacing:.2em;color:#7b846f;}
.theme-gallery h1 {margin:0;font-size:31px;font-weight:500;letter-spacing:-.03em;}
.gallery-subtitle {margin:12px 0 22px;font-size:12px;color:#747b68;}
.gallery-toolbar {display:flex;gap:6px;flex-wrap:wrap;margin-bottom:32px;}
.gallery-toolbar button {padding:7px 12px;border:1px solid #b6bda9;border-radius:7px;background:#f7f6ed;color:#44523d;font:inherit;font-size:11px;cursor:pointer;}
.gallery-toolbar button[aria-pressed="true"] {background:#344d37;color:#f8f4df;border-color:#344d37;}
.gallery-grid {display:grid;grid-template-columns:repeat(2,364px);gap:30px 26px;}
.gallery-medium {grid-template-columns:224px 364px;gap:24px 28px;}
.gallery-medium .gallery-poster {grid-row:span 2;}
.gallery-medium .gallery-poster .gallery-caption {flex-direction:column;align-items:flex-start;gap:4px;}
.gallery-caption {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:#334b35;}
.gallery-caption span:last-child {font-size:10px;color:#79816c;}
.gallery-small {grid-template-columns:repeat(3,170px);}
.gallery-large {margin-left:-88px;}
.gallery-small article {display:flex;align-items:center;flex-direction:column;}
.gallery-small .gallery-caption {width:170px;flex-direction:column;align-items:flex-start;gap:4px;}
.theme-gallery footer {margin-top:28px;font-size:10px;line-height:17px;color:#7a816f;}
:root[data-theme="dark"] body {background:#202920;}
:root[data-theme="dark"] .theme-gallery,:root[data-theme="dark"] .gallery-caption {color:#d9dfc7;}
:root[data-theme="dark"] .gallery-subtitle,:root[data-theme="dark"] .gallery-caption span:last-child,:root[data-theme="dark"] .theme-gallery footer {color:#a4ae98;}
@media(max-width:620px) {.theme-gallery {padding:30px 20px;}.gallery-grid {grid-template-columns:364px;}.gallery-medium .gallery-poster {grid-row:auto;}.gallery-large {margin-left:0;}.theme-gallery h1 {font-size:25px;}}
</style>
</body></html>
